name: Account Access SQL Acceptance
on:
  pull_request:
    paths: ['database/azure-sql/060_*','database/azure-sql/061_*','database/azure-sql/062_*','database/azure-sql/063_*','database/azure-sql/rollback_060_*','database/azure-sql/rollback_061_*','database/azure-sql/rollback_062_*','database/azure-sql/rollback_063_*','server/src/access/**','server/src/data/sql-account-access-repository.js','server/src/data/sql-teaching-access-repository.js','server/src/data/sql-leadership-access-repository.js','server/test/account-access*','server/test/*teaching-access*','server/test/leadership-*','server/test/sql-leadership-*','server/test/fixtures/leadership-access-*','tools/test-account-access-sql.ps1','tools/test-teaching-access-sql.ps1','.github/workflows/account-access-sql.yml']
  push:
    branches: [main]
    paths: ['database/azure-sql/060_*','database/azure-sql/061_*','database/azure-sql/062_*','database/azure-sql/063_*','database/azure-sql/rollback_060_*','database/azure-sql/rollback_061_*','database/azure-sql/rollback_062_*','database/azure-sql/rollback_063_*','server/src/access/**','server/src/data/sql-account-access-repository.js','server/src/data/sql-teaching-access-repository.js','server/src/data/sql-leadership-access-repository.js','server/test/account-access*','server/test/*teaching-access*','server/test/leadership-*','server/test/sql-leadership-*','server/test/fixtures/leadership-access-*','tools/test-account-access-sql.ps1','tools/test-teaching-access-sql.ps1','.github/workflows/account-access-sql.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access_sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start labeled disposable SQL
        shell: pwsh
        run: |
          $testPassword='Synthetic-'+[guid]::NewGuid().ToString()+'!Aa1'
          Write-Output "::add-mask::$testPassword"
          "PAWS_SQL_TEST_PASSWORD=$testPassword" >> $env:GITHUB_ENV
          docker run --name paws-calendar-access-test --label paws.calendar-test=1 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$testPassword" -d mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          if($LASTEXITCODE -ne 0){throw 'Synthetic SQL start failed.'}
          $ready=$false
          for($attempt=0;$attempt -lt 60;$attempt++){
            docker exec -e "SQLCMDPASSWORD=$testPassword" paws-calendar-access-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' 2>$null | Out-Null
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $ready){throw 'Synthetic SQL did not become ready.'}
      - name: Verify persisted grants, atomic audit, concurrency and guarded rollback
        shell: pwsh
        run: |
          ./tools/test-teaching-access-sql.ps1 -ContainerName paws-calendar-access-test | Tee-Object -Variable output
          foreach($marker in @('EXISTING_PRINCIPAL_REFUSED','MIGRATION_PRESERVES_GRANTS','PERSISTED_IDEMPOTENT_AUDIT','STALE_ABA_DENIED','OWNER_PROTECTION','ATOMIC_ROLLBACK','CONCURRENT_OWNER_REVOCATION','USED_ROLLBACK_REFUSED','EMPTY_ROLLBACK_OK')){
            if(($output -join "`n") -notmatch ('ACCOUNT_ACCESS_060_'+$marker)){throw "Missing access acceptance marker: $marker"}
          }
          foreach($marker in @('PROFILE_VALUES_PRESERVED','MASTER_SNAPSHOT_COMPATIBILITY','NO_SEED_SCHEDULE_VERSION_REUSED','EXPLICIT_SOURCE_AND_LEGACY_BOUNDARIES','DUAL_ROLE_SCOPE_AND_DATES','APPROVED_SCOPE_CANNOT_WIDEN','SCOPE_SCHEDULE_ABA_EPOCH','SOURCE_PROFILE_REVOCATION','USED_ROLLBACK_REFUSED','UNUSED_ROLLBACK_PRESERVES_060')){
            if(($output -join "`n") -notmatch ('TEACHING_ACCESS_061_'+$marker)){throw "Missing leadership acceptance marker: $marker"}
          }
          foreach($marker in @('PERSISTED_REPLAY_AUDIT','STALE_ABA_DENIED','SCOPE_SOURCE_DATES_OVERLAP_DENIED','PROTECTED_AND_NULL_INPUT_DENIED','RECORDED_GAP_AND_ACTOR_CHANGED_DENIED','OWNER_ATOMIC_REVOKE','RECORDED_VISC_AREA_BOUNDARY','HISTORY_YEAR_OWNER_BOUNDARY','CONCURRENT_EPOCH_SERIALIZATION','USED_ROLLBACK_REFUSED','UNUSED_ROLLBACK_PRESERVES_061')){
            if(($output -join "`n") -notmatch ('LEADERSHIP_COMMAND_062_'+$marker)){throw "Missing leadership command acceptance marker: $marker"}
          }
          foreach($marker in @('MASTER_UNDO_REQUIRES_REVOKE','DUAL_SCOPE_SWAP_DEVELOPER','MIXED_AND_OWNERSHIP_ABA','SEPARATE_REVIEW_REVISION_FLOW','EXPIRY_DISABLED_LEGACY','USED_ROLLBACK_REFUSED','UNUSED_EXACT_MODULE_RESTORE')){
            if(($output -join "`n") -notmatch ('SCOPED_WORKFLOW_063_'+$marker)){throw "Missing scoped workflow acceptance marker: $marker"}
          }
      - name: Stop owned synthetic container
        if: always()
        shell: pwsh
        run: |
          $container=docker inspect paws-calendar-access-test 2>$null | ConvertFrom-Json
          if($container -and $container[0].Config.Labels.'paws.calendar-test' -eq '1'){docker rm -f paws-calendar-access-test}
