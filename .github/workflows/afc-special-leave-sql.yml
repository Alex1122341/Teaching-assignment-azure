name: AFC Special Leave SQL acceptance
on:
  pull_request:
    paths:
      - 'database/azure-sql/068_*'
      - 'server/src/data/sql-afc-special-leave-repository.js'
      - 'tools/test-afc-special-leave-integration.cjs'
      - '.github/workflows/afc-special-leave-sql.yml'
  push:
    branches: [main]
    paths:
      - 'database/azure-sql/068_*'
      - 'server/src/data/sql-afc-special-leave-repository.js'
      - 'tools/test-afc-special-leave-integration.cjs'
      - '.github/workflows/afc-special-leave-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Start labeled disposable SQL
        shell: pwsh
        run: |
          $password='Synthetic-'+[guid]::NewGuid().ToString()+'!Aa1'
          Write-Output "::add-mask::$password"
          "PAWS_SQL_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
          docker run --name paws-calendar-afc-068 --label paws.calendar-test=1 -p 127.0.0.1:14339:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" -d mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          if($LASTEXITCODE -ne 0){throw 'Synthetic SQL start failed.'}
          for($i=0;$i -lt 60;$i++){
            docker exec -e "SQLCMDPASSWORD=$password" paws-calendar-afc-068 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' 2>$null | Out-Null
            if($LASTEXITCODE -eq 0){return}
            Start-Sleep -Seconds 2
          }
          throw 'Synthetic SQL readiness failed.'
      - name: Verify persisted deductions and scheduling availability
        shell: pwsh
        run: |
          . ./tools/test-calendar-activity-sql.ps1 -ContainerName paws-calendar-afc-068 -Through '041' -SkipAcceptance
          foreach($file in @('042_adfa_swap_preview','043_scheduling_tasks','047_change_history','048_afc_form_upload','050_afc_record_documents','056_faculty_availability_read','064_afc_date_edit','068_afc_special_leave')){
            Invoke-TestSql (Get-Content -LiteralPath "database/azure-sql/$file.sql" -Raw) 'VetMed-Ops'
          }
          $output=@(Invoke-TestSql (Get-Content -LiteralPath 'database/azure-sql/068_afc_special_leave_acceptance.sql' -Raw) 'VetMed-Ops')
          $output
          if(($output -join "`n") -notmatch 'AFC_SPECIAL_LEAVE_068_ACCEPTANCE_OK'){throw 'Missing Special Leave acceptance marker.'}
          node tools/test-afc-special-leave-integration.cjs
          if($LASTEXITCODE -ne 0){throw 'Node and SQL Special Leave integration failed.'}
      - name: Stop labeled disposable SQL
        if: always()
        shell: pwsh
        run: |
          $container=docker inspect paws-calendar-afc-068 2>$null | ConvertFrom-Json
          if($container -and $container[0].Config.Labels.'paws.calendar-test' -eq '1'){docker rm -f paws-calendar-afc-068}
