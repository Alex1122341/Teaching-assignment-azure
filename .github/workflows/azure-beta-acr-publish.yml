name: Azure Beta ACR Publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Azure Beta Build run ID from main
        required: true
        type: string
      commit_sha:
        description: Exact main commit whose tested artifact must be published
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  ACR_NAME: pawssqlbetaacr
  IMAGE_REPOSITORY: paws-sql-beta-api

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact requested main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}

      - name: Verify exact main commit and successful source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          test -n "$COMMIT_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$COMMIT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/azure-beta-build.yml"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "main"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$COMMIT_SHA"
          test "$(jq -r '.status' <<< "$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"

      - name: Download exact tested combined artifact
        uses: actions/download-artifact@v8
        with:
          name: azure-beta-${{ inputs.commit_sha }}
          path: .azure-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify tested artifact handoff and both runtime freezes
        run: |
          set -euo pipefail
          test -f .azure-production/app/index.html
          test -f .azure-production/app/staticwebapp.config.json
          test -f .azure-production/api/index.js
          test -f .azure-production/api/artifact-inventory.json
          node tools/beta-freeze.js
          node tools/beta-api-freeze.js
          node tools/beta-freeze.js --artifact .azure-production/app
          node tools/beta-api-freeze.js --artifact .azure-production/api

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.PAWS_BETA_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PAWS_BETA_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PAWS_BETA_AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to ACR with managed identity role
        run: az acr login --name "$ACR_NAME"

      - name: Refuse an existing process tag before build or push
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          err_file="$(mktemp)"
          set +e
          az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY:$COMMIT_SHA" -o json > /tmp/existing-tag.json 2>"$err_file"
          status=$?
          set -e
          classification="$(node tools/beta-acr-tag-guard.js "$status" "$err_file")"
          case "$classification" in
            EXISTS)
              echo 'SHA_TAG_ALREADY_EXISTS_REVIEW_REQUIRED'
              exit 1
              ;;
            ABSENT)
              echo 'SHA tag is absent; single-publish guard permits the build.'
              ;;
            *)
              cat "$err_file" >&2
              exit "$status"
              ;;
          esac

      - name: Build image from the downloaded tested API artifact
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: docker build -f deploy/aca/Dockerfile -t "$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$COMMIT_SHA" .

      - name: Push verified SHA image
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: docker push "$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$COMMIT_SHA"

      - name: Verify published image digest and write evidence
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY:$COMMIT_SHA" --query digest -o tsv)"
          test -n "$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p aca-image-evidence
          jq -n \
            --arg commitSha "$COMMIT_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg publishRunId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg imageRepository "$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY" \
            --arg imageTag "$COMMIT_SHA" \
            --arg imageDigest "$digest" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commitSha:$commitSha,sourceRunId:$sourceRunId,publishRunId:$publishRunId,repository:$repository,imageRepository:$imageRepository,imageTag:$imageTag,imageDigest:$imageDigest,createdAt:$createdAt}' \
            > aca-image-evidence/aca-image-evidence.json
          printf 'Published verified image digest: %s\n' "$digest"

      - name: Upload image evidence
        uses: actions/upload-artifact@v7
        with:
          name: aca-image-${{ inputs.commit_sha }}
          path: aca-image-evidence/aca-image-evidence.json
          if-no-files-found: error
          retention-days: 7
