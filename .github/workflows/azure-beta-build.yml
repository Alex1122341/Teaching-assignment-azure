name: Azure Beta Build

on:
  pull_request:
    branches: [main, feature/azure-sql-cutover-foundation]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix swa-api
      - run: npm test
      - name: Run server SQL runtime authorization tests
        run: npm test --prefix server
      - run: npm run test:emulator
      - run: node tools/build-beta-release.js
      - name: Verify strict frozen main runtime
        if: github.event_name == 'push'
        run: |
          node tools/beta-freeze.js
          node tools/beta-freeze.js --artifact .azure-production/app
      - name: Verify explicit release-candidate drift
        if: github.event_name != 'push'
        run: node tools/verify-beta-candidate.js
      - run: node --test tests/beta-baseline.test.js tests/azure-deployment.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: azure-beta-${{ github.sha }}
          path: .azure-production
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
