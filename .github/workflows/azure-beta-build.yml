name: PAWS Beta Build (legacy artifact format)

on:
  pull_request:
    branches: [main, feature/azure-sql-cutover-foundation]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing_parity:
    if: ${{ github.head_ref == 'feat/paws-testing-environment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix server
      - name: Audit tracked Chinese-language notes
        run: node tools/audit-language.js
      - name: Guard inherited Beta business code and separate Testing overlays
        run: |
          git fetch origin main
          node tools/testing/verify-overlay.js
      - name: Run Testing root behavior suite with explicit historical Production-only assertions
        run: node tools/testing/run-root-suite.js
      - name: Run all server tests
        run: npm test --prefix server
      - name: Run real Firebase Auth and Firestore Emulator acceptance
        run: npx --no-install firebase emulators:exec --only firestore,auth --project demo-ucvm-access 'node tools/testing/run-root-suite.js'
      - name: Check immutable accepted Beta main in a separate checkout
        run: |
          git worktree add --detach ../paws-accepted-main origin/main
          (
            cd ../paws-accepted-main
            node tools/beta-freeze.js
            node tools/beta-api-freeze.js
          )
          git worktree remove ../paws-accepted-main
      - name: Check Testing identity and SQL migration safeguards
        run: |
          node tools/render-environment-config.js --check
          node tools/verify-environment-config.js --repository
          node --test tests/dual-environment-config.test.js tests/testing-db-tooling.test.js tests/university-testing-migrations.test.js tests/testing-deployment-readiness.test.js
      - name: Build and verify source-level Testing candidate
        run: |
          node tools/build-static.js
          node tools/build-testing-release.js --if-provisioned | tee testing-readiness.json
          if grep -q '"skipped":true' testing-readiness.json; then
            echo "::warning::Testing Hosting/API/Firebase config is NOT provisioned; this successful code gate is NOT deployment approval."
          fi
  test_and_build:
    if: ${{ github.head_ref != 'feat/paws-testing-environment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix server
      - name: Audit tracked Chinese-language notes
        run: node tools/audit-language.js
      - run: npm test
      - name: Run server SQL runtime authorization tests
        run: npm test --prefix server
      - run: npm run test:emulator
      - run: node tools/build-beta-release.js
      # BETA-R4D-9C (Governance Commit D): the frozen baseline IS Runtime Commit C, so both
      # pull_request and push validate the same frozen runtime with ZERO allowed
      # protected drift. There is no candidate-drift exception any more.
      - name: Verify frozen Beta runtime baseline (repository)
        run: node tools/verify-beta-candidate.js
      - name: Verify frozen Beta runtime baseline (built artifact)
        run: node tools/beta-freeze.js --artifact .azure-production/app
      - name: Verify frozen API runtime baseline (repository)
        run: node tools/beta-api-freeze.js
      - name: Verify frozen API runtime baseline (built artifact)
        run: node tools/beta-api-freeze.js --artifact .azure-production/api
      - run: node --test tests/beta-baseline.test.js tests/azure-deployment.test.js
      # Dual environment: one commit, two artifacts. The production artifact is unchanged; the Testing
      # artifact differs only in its rendered environment configuration and is built only once the
      # Testing resources are provisioned (config/environments/testing.json complete).
      - name: Verify environment configuration (repository)
        run: node tools/verify-environment-config.js --repository
      - name: Verify production artifact environment
        run: node tools/verify-environment-config.js --artifact .azure-production/app --environment production
      - name: Build Testing artifact (when provisioned)
        id: testing_artifact
        run: |
          node tools/build-testing-release.js --if-provisioned | tee testing-build.json
          if [ -d .azure-testing/app ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify Testing artifact (environment guard + frozen runtime)
        if: steps.testing_artifact.outputs.built == 'true'
        run: |
          node tools/verify-environment-config.js --artifact .azure-testing/app --environment testing
          node tools/beta-freeze.js --artifact .azure-testing/app --environment testing
      - uses: actions/upload-artifact@v7
        with:
          name: azure-beta-${{ github.sha }}
          path: .azure-production
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: steps.testing_artifact.outputs.built == 'true'
        with:
          name: paws-testing-${{ github.sha }}
          path: .azure-testing
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
