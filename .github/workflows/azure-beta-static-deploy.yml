name: Azure Beta Static Deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Azure Beta Build push run ID from main
        required: true
        type: string
      commit_sha:
        description: Exact current main commit whose tested artifact is released
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  SWA_URL: https://red-cliff-04871ca0f.5.azurestaticapps.net

concurrency:
  group: azure-beta-static-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  deploy_static:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact requested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact main and successful exact-main push build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$COMMIT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/azure-beta-build.yml"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "main"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$COMMIT_SHA"
          test "$(jq -r '.status' <<< "$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"

      - name: Verify frozen repository runtime before artifact handoff
        run: |
          node tools/beta-freeze.js
          node tools/beta-api-freeze.js

      - name: Download exact tested combined artifact
        uses: actions/download-artifact@v8
        with:
          name: azure-beta-${{ inputs.commit_sha }}
          path: .azure-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify tested artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          test -f .azure-production/app/index.html
          test -f .azure-production/app/staticwebapp.config.json
          test -f .azure-production/api/index.js
          test -f .azure-production/api/package-lock.json
          test -f .azure-production/api/artifact-inventory.json

      - name: Verify frozen static and API artifacts
        run: |
          node tools/beta-freeze.js --artifact .azure-production/app
          node tools/beta-api-freeze.js --artifact .azure-production/api

      - name: Derive University API origin and immutable trust anchor
        id: release_identity
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          api_origin="$(node - <<'NODE'
          const config = require('./paws-api-origin.js');
          const url = new URL(config.apiOrigin);
          if (url.protocol !== 'https:' || !['', '/'].includes(url.pathname) || url.search || url.hash || url.username || url.password) {
            throw new Error('paws-api-origin.js must contain a bare HTTPS origin');
          }
          process.stdout.write(url.origin);
          NODE
          )"
          trust_anchor="$(node -p "require('./tools/beta-freeze.js').BASELINE_COMMIT")"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$trust_anchor" =~ ^[0-9a-f]{40}$ ]]
          echo "apiOrigin=$api_origin" >> "$GITHUB_OUTPUT"
          echo "runtimeTrustAnchor=$trust_anchor" >> "$GITHUB_OUTPUT"

      - name: Verify SQL health before static release
        id: predeploy_sql
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          passed=false
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 10 -o predeploy-sql-health.json -w '%{http_code}' "$API_ORIGIN/api/health/sql" || true)"
            if [ "$status" = "200" ] \
              && [ "$(jq -r '.status // empty' predeploy-sql-health.json 2>/dev/null || true)" = "ok" ] \
              && [ "$(jq -r '.service // empty' predeploy-sql-health.json 2>/dev/null || true)" = "paws-beta-sql-runtime" ]; then
              passed=true
              break
            fi
            sleep 10
          done
          if [ "$passed" != true ]; then
            echo 'PREDEPLOY_SQL_HEALTH_BLOCKER'
            exit 1
          fi
          echo 'sqlHealthPassed=true' >> "$GITHUB_OUTPUT"

      - name: Verify runtime release identity and disabled write gates before static release
        id: predeploy_runtime
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TRUST_ANCHOR: ${{ steps.release_identity.outputs.runtimeTrustAnchor }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 10 -o predeploy-runtime.json -w '%{http_code}' "$API_ORIGIN/api/health/runtime" || true)"
          test "$status" = "200"
          jq -e --arg commit "$COMMIT_SHA" --arg trust "$TRUST_ANCHOR" '
            .status == "ok" and
            .service == "paws-university-api" and
            .authority == "vetmed-ops-sql" and
            .releaseSha == $commit and
            .runtimeTrustAnchor == $trust and
            (.writeGates | .afcSingle == false and .afcBatch == false and .sessionEdit == false and .afcRequest == false and .afcDecision == false and .afcArtifact == false)
          ' predeploy-runtime.json > /dev/null
          echo 'runtimeAttestationPassed=true' >> "$GITHUB_OUTPUT"
          jq -c '{authority,releaseSha,runtimeTrustAnchor,writeGates}' predeploy-runtime.json | sed 's/^/runtimeAttestation=/' >> "$GITHUB_OUTPUT"

      - name: Verify anonymous auth boundary before static release
        id: predeploy_auth
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          routes=(
            /api/v1/me
            /api/v1/dashboard/summary
            /api/v1/dashboard/faculty
            /api/v1/dashboard/teaching-summary
            /api/v1/dashboard/roles
            /api/v1/dashboard/doe-overview
          )
          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "$API_ORIGIN$route" || true)"
            test "$status" = "401"
          done
          echo 'authBoundaryPassed=true' >> "$GITHUB_OUTPUT"

      - name: Verify API CORS preflight before static release
        id: predeploy_cors
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 10 -D predeploy-cors-headers.txt -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$API_ORIGIN/api/health/runtime" \
            -H "Origin: $SWA_URL" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' || true)"
          test "$status" = "204"
          grep -Eiq "^access-control-allow-origin: ${SWA_URL//./\\.}[[:space:]]*$" predeploy-cors-headers.txt
          grep -Eiq '^access-control-allow-methods:.*GET.*OPTIONS' predeploy-cors-headers.txt
          grep -Eiq '^access-control-allow-headers:.*Authorization.*Content-Type' predeploy-cors-headers.txt
          ! grep -Eiq '^access-control-allow-credentials:' predeploy-cors-headers.txt
          echo 'corsPassed=true' >> "$GITHUB_OUTPUT"

      - name: Deploy tested static app
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .azure-production/app
          output_location: ''
          skip_app_build: true
          production_branch: main

      - name: Verify public static bytes converge to tested artifact
        id: static_verify
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          files=(index.html asset-loader.js paws-api-origin.js paws-data-client.js afc-workflow.js afc-workflow-sql.js approval-workflow.js)
          mkdir -p public-static
          passed=false
          for attempt in $(seq 1 12); do
            all_match=true
            for file in "${files[@]}"; do
              expected=".azure-production/app/$file"
              target="public-static/$file"
              status="$(curl --silent --show-error --max-time 20 -o "$target" -w '%{http_code}' "${SWA_URL}/$file?b0d=${COMMIT_SHA}&attempt=${attempt}" || true)"
              if [ "$status" != "200" ] || [ ! -f "$expected" ] || ! cmp -s "$expected" "$target"; then
                all_match=false
              fi
            done
            if [ "$all_match" = true ]; then
              passed=true
              break
            fi
            sleep 10
          done
          if [ "$passed" != true ]; then
            echo 'STATIC_ASSET_CONVERGENCE_BLOCKER'
            exit 1
          fi
          echo 'staticHashesPassed=true' >> "$GITHUB_OUTPUT"

      - name: Verify SQL health after static release
        id: postdeploy_sql
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 10 -o postdeploy-sql-health.json -w '%{http_code}' "$API_ORIGIN/api/health/sql" || true)"
          test "$status" = "200"
          test "$(jq -r '.status // empty' postdeploy-sql-health.json)" = "ok"
          test "$(jq -r '.service // empty' postdeploy-sql-health.json)" = "paws-beta-sql-runtime"
          echo 'sqlHealthPassed=true' >> "$GITHUB_OUTPUT"

      - name: Verify runtime release identity and disabled write gates after static release
        id: postdeploy_runtime
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TRUST_ANCHOR: ${{ steps.release_identity.outputs.runtimeTrustAnchor }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 10 -o postdeploy-runtime.json -w '%{http_code}' "$API_ORIGIN/api/health/runtime" || true)"
          test "$status" = "200"
          jq -e --arg commit "$COMMIT_SHA" --arg trust "$TRUST_ANCHOR" '
            .status == "ok" and
            .service == "paws-university-api" and
            .authority == "vetmed-ops-sql" and
            .releaseSha == $commit and
            .runtimeTrustAnchor == $trust and
            (.writeGates | .afcSingle == false and .afcBatch == false and .sessionEdit == false and .afcRequest == false and .afcDecision == false and .afcArtifact == false)
          ' postdeploy-runtime.json > /dev/null
          echo 'runtimeAttestationPassed=true' >> "$GITHUB_OUTPUT"
          jq -c '{authority,releaseSha,runtimeTrustAnchor,writeGates}' postdeploy-runtime.json | sed 's/^/runtimeAttestation=/' >> "$GITHUB_OUTPUT"

      - name: Verify anonymous auth boundary after static release
        id: postdeploy_auth
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          routes=(
            /api/v1/me
            /api/v1/dashboard/summary
            /api/v1/dashboard/faculty
            /api/v1/dashboard/teaching-summary
            /api/v1/dashboard/roles
            /api/v1/dashboard/doe-overview
          )
          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "$API_ORIGIN$route" || true)"
            test "$status" = "401"
          done
          echo 'authBoundaryPassed=true' >> "$GITHUB_OUTPUT"

      - name: Verify API CORS preflight after static release
        id: postdeploy_cors
        shell: bash
        env:
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 10 -D postdeploy-cors-headers.txt -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$API_ORIGIN/api/health/runtime" \
            -H "Origin: $SWA_URL" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' || true)"
          test "$status" = "204"
          grep -Eiq "^access-control-allow-origin: ${SWA_URL//./\\.}[[:space:]]*$" postdeploy-cors-headers.txt
          grep -Eiq '^access-control-allow-methods:.*GET.*OPTIONS' postdeploy-cors-headers.txt
          grep -Eiq '^access-control-allow-headers:.*Authorization.*Content-Type' postdeploy-cors-headers.txt
          ! grep -Eiq '^access-control-allow-credentials:' postdeploy-cors-headers.txt
          echo 'corsPassed=true' >> "$GITHUB_OUTPUT"

      - name: Write static deploy evidence
        if: always()
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          API_ORIGIN: ${{ steps.release_identity.outputs.apiOrigin }}
          TRUST_ANCHOR: ${{ steps.release_identity.outputs.runtimeTrustAnchor }}
          PRE_SQL: ${{ steps.predeploy_sql.outputs.sqlHealthPassed == 'true' && 'true' || 'false' }}
          POST_SQL: ${{ steps.postdeploy_sql.outputs.sqlHealthPassed == 'true' && 'true' || 'false' }}
          PRE_RUNTIME: ${{ steps.predeploy_runtime.outputs.runtimeAttestationPassed == 'true' && 'true' || 'false' }}
          POST_RUNTIME: ${{ steps.postdeploy_runtime.outputs.runtimeAttestationPassed == 'true' && 'true' || 'false' }}
          PRE_AUTH: ${{ steps.predeploy_auth.outputs.authBoundaryPassed == 'true' && 'true' || 'false' }}
          POST_AUTH: ${{ steps.postdeploy_auth.outputs.authBoundaryPassed == 'true' && 'true' || 'false' }}
          PRE_CORS: ${{ steps.predeploy_cors.outputs.corsPassed == 'true' && 'true' || 'false' }}
          POST_CORS: ${{ steps.postdeploy_cors.outputs.corsPassed == 'true' && 'true' || 'false' }}
          STATIC_HASHES: ${{ steps.static_verify.outputs.staticHashesPassed == 'true' && 'true' || 'false' }}
          PRE_ATTESTATION: ${{ steps.predeploy_runtime.outputs.runtimeAttestation || '{}' }}
          POST_ATTESTATION: ${{ steps.postdeploy_runtime.outputs.runtimeAttestation || '{}' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$COMMIT_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg staticDeployRunId "$GITHUB_RUN_ID" \
            --arg staticDeployRunNumber "$GITHUB_RUN_NUMBER" \
            --arg siteUrl "$SWA_URL" \
            --arg apiOrigin "$API_ORIGIN" \
            --arg releaseSha "$COMMIT_SHA" \
            --arg runtimeTrustAnchor "$TRUST_ANCHOR" \
            --arg deployedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runtimePre "$PRE_ATTESTATION" \
            --argjson runtimePost "$POST_ATTESTATION" \
            --argjson sqlHealthPre "$PRE_SQL" \
            --argjson sqlHealthPost "$POST_SQL" \
            --argjson runtimeAttestationPre "$PRE_RUNTIME" \
            --argjson runtimeAttestationPost "$POST_RUNTIME" \
            --argjson authBoundaryPre "$PRE_AUTH" \
            --argjson authBoundaryPost "$POST_AUTH" \
            --argjson corsPre "$PRE_CORS" \
            --argjson corsPost "$POST_CORS" \
            --argjson staticHashesPassed "$STATIC_HASHES" \
            '{repository:$repository,commitSha:$commitSha,sourceRunId:$sourceRunId,staticDeployRunId:$staticDeployRunId,staticDeployRunNumber:$staticDeployRunNumber,siteUrl:$siteUrl,apiOrigin:$apiOrigin,releaseSha:$releaseSha,runtimeTrustAnchor:$runtimeTrustAnchor,writeGatesPre:($runtimePre.writeGates // null),writeGatesPost:($runtimePost.writeGates // null),sqlHealthPre:$sqlHealthPre,sqlHealthPost:$sqlHealthPost,runtimeAttestationPre:$runtimeAttestationPre,runtimeAttestationPost:$runtimeAttestationPost,authBoundaryPre:$authBoundaryPre,authBoundaryPost:$authBoundaryPost,corsPre:$corsPre,corsPost:$corsPost,staticHashesPassed:$staticHashesPassed,deployedAtUtc:$deployedAtUtc}' \
            > static-deploy-evidence.json

      - name: Upload static deploy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-deploy-${{ inputs.commit_sha }}
          path: static-deploy-evidence.json
          if-no-files-found: error
          retention-days: 7
