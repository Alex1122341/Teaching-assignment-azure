name: Faculty administration SQL acceptance
on:
  pull_request:
    paths:
      - 'database/azure-sql/065_*'
      - 'database/azure-sql/067_*'
      - 'database/azure-sql/rollback_065_*'
      - 'tools/test-faculty-future-activation-sql.ps1'
      - 'server/test/faculty-future-activation*'
      - '.github/workflows/faculty-future-activation-sql.yml'
  push:
    branches: [main]
    paths:
      - 'database/azure-sql/065_*'
      - 'database/azure-sql/067_*'
      - 'database/azure-sql/rollback_065_*'
      - 'tools/test-faculty-future-activation-sql.ps1'
      - 'server/test/faculty-future-activation*'
      - '.github/workflows/faculty-future-activation-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faculty_065_sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start labeled synthetic SQL Server
        shell: pwsh
        run: |
          $password='Synthetic-'+[guid]::NewGuid().ToString()+'!Aa1'
          Write-Output "::add-mask::$password"
          "PAWS_SQL_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
          docker run --name paws-calendar-faculty-065 --label paws.calendar-test=1 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" -d mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          if($LASTEXITCODE -ne 0){throw 'Synthetic container start failed.'}
          $ready=$false
          for($i=0;$i -lt 60;$i++){
            docker exec -e "SQLCMDPASSWORD=$password" paws-calendar-faculty-065 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' 2>$null | Out-Null
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $ready){throw 'Disposable SQL is unavailable.'}
      - name: Validate creation, dates, protected assignments, rollback
        shell: pwsh
        run: |
          $out=@(./tools/test-faculty-future-activation-sql.ps1 -ContainerName paws-calendar-faculty-065)
          $combined=$out -join "`n"
          foreach($marker in @(
             'FACULTY_FUTURE_ACTIVATION_ROLLBACK_ACCEPTANCE_OK',
             'FACULTY_065_PRESTART_ASSIGNMENT_DENIED',
             'FACULTY_065_START_DATE_ASSIGNMENT_ALLOWED',
             'FACULTY_065_SESSION_REDATE_DENIED',
             'FACULTY_065_BACKDATING_EXISTING_ASSIGNMENT_DENIED',
             'FACULTY_065_MANUAL_DEACTIVATION_WINS',
             'FACULTY_065_USED_ROLLBACK_REFUSED',
             'FACULTY_065_EMPTY_ROLLBACK_OK'
          )) { if($combined -notmatch $marker){throw "Missing marker: $marker"} }
          Write-Output 'FUTURE_FACULTY_065_ACCEPTANCE_OK'
      - name: Validate Faculty DOE inputs, source preservation and rollback
        shell: pwsh
        run: |
          . ./tools/test-calendar-activity-sql.ps1 -ContainerName paws-calendar-faculty-065 -Through '041' -SkipAcceptance
          foreach ($script in @('065_faculty_future_activation','066_sessional_and_doe_summary_source','067_faculty_teaching_doe_inputs','067_faculty_teaching_doe_inputs_acceptance')) {
            $result=Invoke-TestSql (Get-Content -LiteralPath "database/azure-sql/$script.sql" -Raw) 'VetMed-Ops'
            $result | Write-Output
            if ($script.EndsWith('_acceptance') -and ($result -join "`n") -notmatch 'FACULTY_067_TEACHING_DOE_ACCEPTANCE_OK') {
              throw 'Missing Faculty DOE SQL acceptance marker.'
            }
          }
      - name: Destroy only the labeled synthetic container
        if: always()
        shell: pwsh
        run: |
          $container=docker inspect paws-calendar-faculty-065 2>$null | ConvertFrom-Json
          if($container -and $container[0].Config.Labels.'paws.calendar-test' -eq '1'){
            docker rm -f paws-calendar-faculty-065
          }
