name: PAWS Testing Database Reset

# Re-initialises the independent Testing database with the committed synthetic data set and
# (re)provisions the Testing sign-in accounts. Never touches Production: it uses only the Testing
# identity and settings (PAWS_TESTING_* repository variables and secrets), and the tool refuses any
# database that does not carry the Testing marker (or is not completely empty).
#
# Authorization: the run must start from main, by a GitHub login listed in the owner-managed repository
# variable PAWS_TESTING_RESET_OPERATORS, with the confirmation text. A reset discards everything in the
# Testing database, including its audit rows; the run uploads its own evidence (who, when, result) so the
# reset itself stays on record.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET-TESTING to confirm
        required: true
        type: string
      initialise_empty:
        description: First-time setup only - initialise a provably empty database that has no Testing marker yet
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: paws-testing-db
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirm == 'RESET-TESTING'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAWS_ENVIRONMENT: testing
      PAWS_TESTING_ENVIRONMENT_ID: ${{ secrets.PAWS_TESTING_ENVIRONMENT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.PAWS_TESTING_FIREBASE_PROJECT_ID }}
      PAWS_SQL_CONNECTION_STRING: ${{ secrets.PAWS_TESTING_SQL_ADMIN_CONNECTION_STRING }}
      PAWS_SQL_MI_CLIENT_ID: ${{ vars.PAWS_TESTING_SQL_ADMIN_CLIENT_ID }}
      PAWS_TESTING_RUNTIME_PRINCIPAL: ${{ vars.PAWS_TESTING_RUNTIME_PRINCIPAL }}
      PAWS_TESTING_SQL_SERVER: ${{ vars.PAWS_TESTING_SQL_SERVER }}
      TESTING_SQL_RESOURCE_GROUP: ${{ vars.PAWS_TESTING_SQL_RESOURCE_GROUP }}
      RESET_OPERATORS: ${{ vars.PAWS_TESTING_RESET_OPERATORS }}
      OPERATOR: ${{ github.triggering_actor }}
    steps:
      - name: Authorize the reset
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo 'RESET_NOT_MAIN: run the reset from main'; exit 1; }
          operator="$(tr '[:upper:]' '[:lower:]' <<< "$OPERATOR")"; listed=false
          IFS=',' read -ra operators <<< "$(tr '[:upper:]' '[:lower:]' <<< "${RESET_OPERATORS:-}")"
          for item in "${operators[@]}"; do [ "$(xargs <<< "$item")" = "$operator" ] && listed=true; done
          [ "$listed" = true ] || { echo "RESET_NOT_AUTHORIZED: $OPERATOR is not in PAWS_TESTING_RESET_OPERATORS"; exit 1; }
          [[ "$PAWS_TESTING_SQL_SERVER" =~ ^[a-z0-9-]+\.database\.windows\.net$ ]] || { echo 'RESET_SQL_SERVER: PAWS_TESTING_SQL_SERVER must be the Testing Azure SQL server'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server --ignore-scripts
      - name: Log in to Azure (Testing identity only)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.PAWS_TESTING_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PAWS_TESTING_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PAWS_TESTING_AZURE_SUBSCRIPTION_ID }}
      - name: Open the Testing SQL firewall for this runner only
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl --silent --max-time 15 https://api.ipify.org)"
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          az sql server firewall-rule create -g "$TESTING_SQL_RESOURCE_GROUP" -s "${PAWS_TESTING_SQL_SERVER%%.*}" \
            -n "paws-reset-${GITHUB_RUN_ID}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
      - name: Reset Testing database with synthetic data
        env:
          INITIALISE_EMPTY: ${{ inputs.initialise_empty }}
        run: |
          set -o pipefail
          if [ "$INITIALISE_EMPTY" = "true" ]; then node tools/testing-db/reset-testing-db.js --confirm-reset --initialise-empty | tee reset.log; else node tools/testing-db/reset-testing-db.js --confirm-reset | tee reset.log; fi
      - name: Provision Testing sign-in accounts
        env:
          PAWS_TEST_PERSONA_PASSWORD: ${{ secrets.PAWS_TEST_PERSONA_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.PAWS_TESTING_FIREBASE_SERVICE_ACCOUNT }}
          OPERATORS_JSON: ${{ secrets.PAWS_TESTING_OPERATORS_JSON }}
        run: |
          if [ -n "$OPERATORS_JSON" ]; then printf '%s' "$OPERATORS_JSON" > operators.json; node tools/testing-db/provision-test-accounts.js --operators operators.json; else node tools/testing-db/provision-test-accounts.js; fi
          rm -f operators.json
      - name: Close the Testing SQL firewall rule
        if: always()
        shell: bash
        run: az sql server firewall-rule delete -g "$TESTING_SQL_RESOURCE_GROUP" -s "${PAWS_TESTING_SQL_SERVER%%.*}" -n "paws-reset-${GITHUB_RUN_ID}" -o none || true
      - name: Write reset evidence
        if: always()
        shell: bash
        run: |
          summary="$(grep -E '^\{"ok":true' reset.log 2>/dev/null | tail -n 1 | jq -c '{counts, fixtureCoverage, migrations: [.migrations[] | select(.status != "ok")]}' 2>/dev/null || echo null)"
          jq -n --arg operator "$OPERATOR" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg status "${{ job.status }}" --arg sha "$GITHUB_SHA" --argjson summary "${summary:-null}" \
            '{kind:"testing-db-reset",operator:$operator,commitSha:$sha,completedAtUtc:$at,status:$status,summary:$summary}' > testing-reset-evidence.json
          cat testing-reset-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paws-testing-reset-${{ github.run_id }}
          path: testing-reset-evidence.json
          retention-days: 90
