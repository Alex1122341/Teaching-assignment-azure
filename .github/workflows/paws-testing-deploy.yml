name: PAWS Testing Deploy

# Main-defined manual publication. The attested API is staged locally first.
# This workflow has no remote shell, SQL administration or Azure mutation.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful exact-main push Build run ID
        required: true
        type: string
      commit_sha:
        description: Exact current main SHA already staged on the Testing API
        required: true
        type: string
      runtime_attestation_json:
        description: Sanitized READY operator attestation from the Testing host Check
        required: true
        type: string
      runtime_attestation_sha256:
        description: Canonical SHA256 emitted with that attestation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: paws-testing-deploy
  cancel-in-progress: false

jobs:
  deploy_testing:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      RUNTIME_ATTESTATION_JSON: ${{ inputs.runtime_attestation_json }}
      RUNTIME_ATTESTATION_SHA256: ${{ inputs.runtime_attestation_sha256 }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main workflow operator and exact push build before executing release tooling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OPERATOR: ${{ github.triggering_actor }}
          PAWS_RELEASE_APPROVERS: ${{ vars.PAWS_RELEASE_APPROVERS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RUNTIME_ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          listed=false
          IFS=',' read -ra operators <<< "$(tr '[:upper:]' '[:lower:]' <<< "${PAWS_RELEASE_APPROVERS:-}")"
          for item in "${operators[@]}"; do [ "$(xargs <<< "$item")" = "${DEPLOY_OPERATOR,,}" ] && listed=true; done
          [ "$listed" = true ] || { echo 'TESTING_DEPLOY_OPERATOR_NOT_LISTED'; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-build.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$COMMIT_SHA" '.repository.full_name==$repo and .path==".github/workflows/azure-beta-build.yml" and .event=="push" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' source-build.json > /dev/null
          printf '%s' "$RUNTIME_ATTESTATION_JSON" > runtime-attestation.json
          artifact_id="$(node -e "try{const a=JSON.parse(process.env.RUNTIME_ATTESTATION_JSON);if(!Number.isSafeInteger(a.sourceArtifactId)||a.sourceArtifactId<1)process.exit(1);console.log(a.sourceArtifactId)}catch{console.error('TESTING_RUNTIME_ATTESTATION_INVALID');process.exit(1)}")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > source-artifact.json
      - name: Download exact tested Testing artifact
        uses: actions/download-artifact@v8
        with:
          name: paws-testing-${{ inputs.commit_sha }}
          path: .azure-testing
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Download exact tested API artifact
        uses: actions/download-artifact@v8
        with:
          name: azure-beta-${{ inputs.commit_sha }}
          path: .azure-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify frozen source and both environment artifacts
        run: |
          node tools/verify-beta-candidate.js
          node tools/verify-environment-config.js --repository
          node tools/verify-environment-config.js --artifact .azure-testing/app --environment testing
          node tools/beta-freeze.js --artifact .azure-testing/app --environment testing
          node tools/beta-api-freeze.js --artifact .azure-production/api
      - name: Probe attested API before Hosting authentication
        run: >-
          node tools/testing/publish-testing-hosting.js --probe-only --sha "$COMMIT_SHA"
          --build source-build.json --source-artifact source-artifact.json
          --attestation runtime-attestation.json --attestation-digest "$RUNTIME_ATTESTATION_SHA256"
      - name: Install locked Firebase CLI
        run: npm ci --ignore-scripts
      - name: Validate the Testing-scoped Hosting credential without printing it
        env:
          TESTING_HOSTING_CREDENTIAL: ${{ secrets.PAWS_TESTING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - <<'NODE'
          try {
            const key=JSON.parse(process.env.TESTING_HOSTING_CREDENTIAL);
            const testing=require('./tools/testing/config/environment.json');
            const {resolveTestingHostingProject}=require('./tools/testing/publish-testing-hosting');
            if(key.project_id!==resolveTestingHostingProject(testing))process.exit(1);
          }catch{console.error('TESTING_HOSTING_CREDENTIAL_INVALID');process.exit(1);}
          NODE
      - name: Authenticate only to Testing Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.PAWS_TESTING_FIREBASE_SERVICE_ACCOUNT }}'
      - name: Publish accepted Testing artifact and verify staged API again
        run: >-
          node tools/testing/publish-testing-hosting.js --sha "$COMMIT_SHA"
          --build source-build.json --source-artifact source-artifact.json
          --attestation runtime-attestation.json --attestation-digest "$RUNTIME_ATTESTATION_SHA256"
      - name: Upload successful main-defined Testing evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: paws-testing-deploy-${{ inputs.commit_sha }}
          path: testing-deploy-evidence.json
          if-no-files-found: error
          retention-days: 90
