name: Session Batch Edit - Isolated SQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/data/sql-session-repository.js'
      - 'server/src/data/sql-connection.js'
      - 'server/src/data/data-api.js'
      - 'server/test/session-batch-edit-api.test.js'
      - 'database/azure-sql/**'
      - 'tools/test-session-batch-edit-sql.ps1'
      - 'tools/test-session-batch-edit-sql.js'
      - '.github/workflows/session-batch-edit-sql.yml'
permissions:
  contents: read
concurrency:
  group: session-batch-sql-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated_sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server
      - name: Start isolated synthetic SQL Server
        id: sql
        shell: pwsh
        run: |
          $testPassword='Synthetic-'+[guid]::NewGuid().ToString()+'!Aa1'
          $marker=[guid]::NewGuid().ToString()
          Write-Output "::add-mask::$testPassword"
          "PAWS_SQL_TEST_PASSWORD=$testPassword" >> $env:GITHUB_ENV
          "PAWS_BATCH_TEST_MARKER=$marker" >> $env:GITHUB_ENV
          docker run --name paws-calendar-batch171 --label paws.calendar-test=1 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$testPassword" -p 127.0.0.1:14337:1433 -d mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          if($LASTEXITCODE -ne 0){throw 'Synthetic container start failed.'}
          $ready=$false
          for($attempt=0;$attempt -lt 60;$attempt++){
            docker exec -e "SQLCMDPASSWORD=$testPassword" paws-calendar-batch171 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' 2>$null | Out-Null
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $ready){throw 'Synthetic SQL container did not become ready.'}
          git rev-parse HEAD
      - name: Verify real batch transactions, audit and concurrent writes
        shell: pwsh
        run: ./tools/test-session-batch-edit-sql.ps1 -ContainerName paws-calendar-batch171
      - name: Verify existing Task Review role and audit contract
        if: ${{ always() && !cancelled() && steps.sql.outcome == 'success' }}
        shell: pwsh
        run: ./tools/test-scheduling-task-sql.ps1 -ContainerName paws-calendar-batch171
      - name: Verify existing Task Review serialization
        if: ${{ always() && !cancelled() && steps.sql.outcome == 'success' }}
        shell: pwsh
        run: ./tools/test-scheduling-task-races.ps1 -ContainerName paws-calendar-batch171
      - name: Remove ephemeral synthetic container
        if: always()
        shell: pwsh
        run: |
          $container = docker inspect paws-calendar-batch171 2>$null
          if($LASTEXITCODE -eq 0){
            $details=$container | ConvertFrom-Json
            if($details[0].Config.Labels.'paws.calendar-test' -ne '1'){throw 'Refusing to remove a non-QA container.'}
            docker rm -f paws-calendar-batch171
          }
